<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Solar Panel Gradient -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="50%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#0a2558"/>
    </linearGradient>
    <!-- Gold Foil Satellite Bus Gradient -->
    <linearGradient id="goldBus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="40%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <!-- Sensor Glow -->
    <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff" stop-opacity="0.2"/>
    </radialGradient>
    <!-- Outer Glow Filter -->
    <filter id="satGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00e5ff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#satGlow)">
    <!-- Solar Array Connecting Booms -->
    <line x1="6" y1="32" x2="58" y2="32" stroke="#ffca28" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Solar Wing (Dual Panels with Photovoltaic Grid) -->
    <g id="left-wing">
      <rect x="5" y="23" width="18" height="18" rx="1.5" fill="url(#solarGrad)" stroke="#64b5f6" stroke-width="0.8"/>
      <!-- Grid lines -->
      <line x1="11" y1="23" x2="11" y2="41" stroke="#90caf9" stroke-width="0.5" opacity="0.8"/>
      <line x1="17" y1="23" x2="17" y2="41" stroke="#90caf9" stroke-width="0.5" opacity="0.8"/>
      <line x1="5" y1="29" x2="23" y2="29" stroke="#90caf9" stroke-width="0.5" opacity="0.8"/>
      <line x1="5" y1="35" x2="23" y2="35" stroke="#90caf9" stroke-width="0.5" opacity="0.8"/>
      <!-- Solar panel border accent -->
      <rect x="5" y="23" width="18" height="18" fill="none" stroke="#ffca28" stroke-width="0.6"/>
    </g>

    <!-- Right Solar Wing (Dual Panels with Photovoltaic Grid) -->
    <g id="right-wing">
      <rect x="41" y="23" width="18" height="18" rx="1.5" fill="url(#solarGrad)" stroke="#64b5f6" stroke-width="0.8"/>
      <!-- Grid lines -->
      <line x1="47" y1="23" x2="47" y2="41" stroke="#90caf9" stroke-width="0.5" opacity="0.8"/>
      <line x1="53" y1="23" x2="53" y2="41" stroke="#90caf9" stroke-width="0.5" opacity="0.8"/>
      <line x1="41" y1="29" x2="59" y2="29" stroke="#90caf9" stroke-width="0.5" opacity="0.8"/>
      <line x1="41" y1="35" x2="59" y2="35" stroke="#90caf9" stroke-width="0.5" opacity="0.8"/>
      <!-- Solar panel border accent -->
      <rect x="41" y="23" width="18" height="18" fill="none" stroke="#ffca28" stroke-width="0.6"/>
    </g>

    <!-- Main Satellite Bus / Spacecraft Body (Gold Foil Insulated) -->
    <rect x="25" y="21" width="14" height="22" rx="2" fill="url(#goldBus)" stroke="#fff8e1" stroke-width="1"/>
    
    <!-- Thermal Radiator Panels / Equipment Deck -->
    <rect x="27" y="23" width="10" height="5" rx="1" fill="#37474f" stroke="#78909c" stroke-width="0.5"/>
    <circle cx="29.5" cy="25.5" r="1" fill="#00e5ff"/>
    <circle cx="34.5" cy="25.5" r="1" fill="#00e5ff"/>

    <!-- High Gain Antenna Dish -->
    <ellipse cx="32" cy="15" rx="6" ry="3" fill="#cfd8dc" stroke="#eceff1" stroke-width="0.8"/>
    <line x1="32" y1="18" x2="32" y2="21" stroke="#b0bec5" stroke-width="1.5"/>
    <circle cx="32" cy="13.5" r="1.2" fill="#ff5252"/>

    <!-- Optical Earth-Observing Sensor / Spectrometer Nadir Aperture -->
    <circle cx="32" cy="35" r="3.5" fill="#212121" stroke="#00e5ff" stroke-width="1"/>
    <circle cx="32" cy="35" r="2.2" fill="url(#sensorGlow)"/>
    <circle cx="32" cy="35" r="0.8" fill="#ffffff"/>

    <!-- Thruster Nozzles on Aft Deck -->
    <polygon points="28,43 27,46 30,46" fill="#ff7043"/>
    <polygon points="34,43 33,46 36,46" fill="#ff7043"/>
  </g>
</svg>
