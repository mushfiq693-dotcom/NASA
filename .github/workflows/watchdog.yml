name: BengalFlare 24/7 Autonomous Wildfire Watchdog

on:
  schedule:
    # Runs every 20 minutes around the clock 24/7 in GitHub's cloud
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  watchdog_scan:
    name: NASA Satellite Telemetry & Weather Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow httpx python-dotenv

      - name: Execute Autonomous Wildfire Watchdog
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY || '1f1f9a28bc8561f922237c272055e274' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '9096332555:AAGyQfnFNyet_2Zjt3hvkS7AoOxqpBS8AVs' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '5408879423' }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '@bengalflare_live' }}
        run: |
          PYTHONPATH=firechronicle python firechronicle/src/alert_daemon.py --once
